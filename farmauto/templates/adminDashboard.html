{% load static %}
<!DOCTYPE html>
<head>
	<title>fasf</title>
	<link rel='stylesheet' href="{% static 'style/dashboard.css'%}">
	
</head>
<body>
<nav>
	<div class='picContain'>
		<div class='pic'></div>
		
	</div>
	<div class='nav'>
	<a><p>{{user.username}}</p></a>
	<a><p>Connected Modules</p></a>
	<a><p>Sensor Data History</p></a>
	</div>
</nav>	
<section>
    <article class="modules">
        <table class="table">
            <tr>
                <th>Module Name</th>
                <th>Password</th>
                <th>User</th>
                <th>Module Type</th>
				<th></th>
            </tr>
            {% for mod in modules %}
                <tr>
                <td>{{mod.name}}</td>
                <td>{{mod.password}}</td>
                <td>{{mod.has_user}}</td>
                <td>{{mod.module_type}}</td>
                <td><a href="{% url 'deleteModule' mod.id%}"><button>Delete</button></a></td>
            </tr>
            {% endfor %}    
			
        </table>
		<a href="{% url 'addModuleAdmin' %}"><button class="addModule">Add</button></a>
    </article>
	
</section>

</script>
</body>
</html>
